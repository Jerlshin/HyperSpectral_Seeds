[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ══════════════════════════════════════════════════════════════════════
#  Package metadata
# ══════════════════════════════════════════════════════════════════════

[project]
name = "spectralquadnet"
version = "0.1.0"
description = "Four-branch hyperspectral CNN/Transformer for 90-class rice seed variety classification from 40-band VIS-NIR patches."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Jerlshin" }]
keywords = ["hyperspectral", "remote-sensing", "deep-learning", "rice-seeds", "pytorch"]

# Runtime dependencies are intentionally unpinned lower bounds: the audited
# environment (REFACTOR_PLAN.md §1.3) runs torch 2.13.0 / numpy 2.1.3, and the
# migration must not force a version change (§6 non-goals).
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "rich>=13.0",
]

[project.optional-dependencies]
# Optional experiment-tracking backends (REFACTOR_PLAN.md §4.1). The default
# `console` tracker needs nothing beyond `rich`, which is a core dependency.
tracking = ["wandb>=0.16", "tensorboard>=2.14"]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.8",
    "pre-commit>=3.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spectralquadnet = ["py.typed"]

# ══════════════════════════════════════════════════════════════════════
#  Tooling (REFACTOR_PLAN.md §4.4)
# ══════════════════════════════════════════════════════════════════════

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# Line length is owned by black; the relocated research code keeps its original
# aligned-literal style, which frequently runs past 100 columns.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["spectralquadnet"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts"]
strict = true
warn_unused_configs = true
# Third-party scientific stack ships incomplete or absent stubs.
[[tool.mypy.overrides]]
module = ["sklearn.*", "pandas.*", "scipy.*", "wandb.*", "tensorboard.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "regression: numerical-identity gates against the pre-refactor baseline (REFACTOR_PLAN.md §3.2)",
    "requires_dataset: needs the real dataset/ or outputs/ artifacts, not run in CI",
]
