# @package _global_
# ══════════════════════════════════════════════════════════════════════
#  seednet_grouped — THE DEFAULT EXPERIMENT
#
#  SpectralSeedNet, one stage, leave-one-bundle-out protocol, selection on a
#  calibration split, val ∪ test scored once. CHANGES §16-§19.
#
#  Usage:
#      python train.py
#      python train.py data.split_fold=1 seed=1
#      python -m spectralquadnet.experiments.cli protocol --experiment seednet_grouped
# ══════════════════════════════════════════════════════════════════════
defaults:
  - /base_experiment
  - /data: spa40_90class_pfix
  - /model: seed_net
  - /single: one_stage
  # The three-stage groups still have to compose: `pipeline=three_stage`
  # reaches them for A8, and the head reads `stage2.arcface_m_*` for the
  # optional per-class margin rule A7 switches on.
  - /stage1: progressive_3phase
  - /stage2: arcface_supcon
  - /stage3: sam_swa
  - /evaluation: held_out_once
  - /tracking: console
  - _self_

pipeline: single

# ── Run identity & output location ────────────────────────────────────
run_name: seednet_grouped_f${data.split_fold}_s${seed}
output_root: outputs
output_dir: ${output_root}/${run_name}

# ── Shared training knobs ──────────────────────────────────────────────
weight_decay: 2.0e-4

# IC-6 / CHANGES §8.1. 1.0 -> 5.0. The backbone's pre-clip norm was 25-50 for
# the entire audited run, so the clip fired on essentially every step and the
# backbone did normalised-gradient descent at a fixed step size — the LR
# schedule controlled step size but its *shape* was interacting with a
# direction-only update. A clip should catch outliers. Watch
# `grad_norm/clip_fraction`: it should fall from ≈1.0 to <0.2.
#
# `single.max_lr` is deliberately NOT co-tuned with this. Change one thing.
grad_clip: 5.0

ema_decay: 0.999

# IC-5 / CHANGES §8.2. GradNorm off. The rule
# `omega <- clip(omega * (g_bar/g_b)^0.5, 0.25, 4.0)` is a multiplicative
# feedback loop with no restoring force except its clips, so its only fixed
# point is `g_b = g_bar` exactly and any persistent deviation compounds
# geometrically until a bound is hit. The panels confirm it: branch_b and
# branch_c pinned at 4.0 for hundreds of epochs, branch_a at the 0.25 floor
# within ~10. The "adaptive" weights were the clip bounds.
#
# SpectralSeedNet has ONE auxiliary head at a fixed `model.aux_head_weight`, so
# there is no per-branch balance left to control.
aux_gradnorm_alpha: 0.0

# ── Test-time augmentation ─────────────────────────────────────────────
# 8 D4 spatial + 4 spectral-gain views. Physically correct (a segmented seed
# has no canonical pose), cheap, and reported SEPARATELY from the untransformed
# number rather than folded into it.
tta_spatial: 8
tta_spectral: 4

# ── Reproducibility & placement ────────────────────────────────────────
device: auto
# Swept over {0, 1, 2} by scripts/run_protocol.py. A single-seed delta is not a
# result: the sampler draws per-class visit counts from a CDWS-weighted
# categorical under an unseeded per-epoch RNG, and run-to-run variance has
# never been measured on this pipeline (CHANGES §8.3). A12 measures it first.
seed: 42

# ── Runtime — IC-8, the project's own invariant restored ───────────────
# CHANGES §8.5. The audited run set `allow_tf32=True` (which cuts matmul
# mantissas from 24 bits to 11, i.e. changes numerics), `num_workers=0` (auto
# would give 8) and `compile=off` (auto would give on). The two knobs that
# would have made it faster were disabled and the one that changes a reported
# number was enabled. That is an experimental-hygiene failure, not a
# correctness bug — but it means the run is not comparable to a run at the
# shipped defaults.
runtime:
  allow_tf32: false
  num_workers: -1
  compile: auto
  amp_dtype: bf16

hydra:
  job:
    chdir: false
  run:
    dir: ${output_dir}/hydra/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${output_root}/multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
