# @package _global_
# ══════════════════════════════════════════════════════════════════════
#  output_v12_spa40 — the reference experiment
#
#  Reproduces the run that produced outputs/output_v12_spa40/ (Macro F1
#  0.8745 / Acc 0.8745 on the held-out test split, per stage3_meta.json).
#  See docs/config_rename_table.md for the full config field reference.
#
#  Usage:  python train.py
#          python train.py stage1.max_lr=1e-4           # single override
#          python train.py -m stage1.max_lr=1e-4,5.0e-4 # sweep
# ══════════════════════════════════════════════════════════════════════
defaults:
  - /base_experiment
  - /data: spa40_90class
  - /model: spectral_quadnet_v4
  - /stage1: progressive_3phase
  - /stage2: arcface_supcon
  - /stage3: sam_swa
  - /tracking: console
  - _self_

# ── Run identity & output location ────────────────────────────────────
# Resolves to outputs/output_v12_spa40, so auto-resume finds the three
# existing stage checkpoints.
run_name: output_v12_spa40
output_root: outputs
output_dir: ${output_root}/${run_name}

# ── Shared training knobs ──────────────────────────────────────────────
weight_decay: 2.0e-4
grad_clip: 1.0
ema_decay: 0.999

# GradNorm exponent for the per-branch auxiliary weights (OP-2 / T2-6). At 0.0
# the weights stay at the hardcoded A/B = 2x vector this replaces.
aux_gradnorm_alpha: 0.5

# ── Test-time augmentation ─────────────────────────────────────────────
tta_spatial: 8
tta_spectral: 4

# ── Reproducibility & placement ────────────────────────────────────────
# "auto" picks the fastest local accelerator: Metal (MPS) → CUDA → CPU. See
# utils/device.py for the full note. Override with device=cuda / cpu / mps.
device: auto
seed: 42

# ── Hydra runtime ───────────────────────────────────────────────────────
# `chdir: false` keeps the process CWD where the user launched it, which is what
# makes data.patches_data's `./dataset/...` relative path resolve correctly.
# With Hydra's 1.1-compatible default (`chdir: true`) the CWD would move into
# the run directory and every relative path would break.
#
# Hydra's own per-run artifacts (the resolved config snapshot, job log) are
# parked under the experiment's own output_dir rather than the default
# `outputs/<date>/<time>/`, which would otherwise litter the directory that holds
# the stage checkpoints.
hydra:
  job:
    chdir: false
  run:
    dir: ${output_dir}/hydra/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${output_root}/multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
