# @package _global_
# ══════════════════════════════════════════════════════════════════════
#  quadnet_audited — the AUDITED baseline, reproduced bit-for-bit.
#
#  SpectralQuadNet v4, three stages, stratified patch-level split, everything
#  fitted and selected on `val`, `allow_tf32=True`, `num_workers=0`,
#  `compile=off`, `grad_clip=1.0`, `aux_gradnorm_alpha=0.5`.
#
#  This is run `stratified_benchmark_rtx3060` as executed, including the three
#  runtime overrides that make it incomparable to the shipped defaults. It is
#  the HISTORICAL REPLICA: the configuration every golden regression digest in
#  `tests/regression/golden/v3/` was captured against, and the left-hand side of
#  the "what did the audit actually measure" comparison. Its value is that it is
#  unmodified. Do not tidy it.
#
#  It is deliberately NOT the arm the branch and curriculum ablations run on.
#  Those need the four-branch architecture on the *current* protocol and the
#  *current* input, which is `experiment/quadnet_full256.yaml`; running them
#  here would vary the split and the band count alongside the treatment.
#
#  Everything CHANGES.md says about this configuration is a criticism of it.
#  It is here to be measured against, not to be run for a headline.
#
#  Usage:
#      python train.py --config-name experiment/quadnet_audited
# ══════════════════════════════════════════════════════════════════════
defaults:
  - /base_experiment
  - /data: ablation/spa40_audited
  - /model: quadnet_v4_audited
  - /single: one_stage        # composed but unused at pipeline=three_stage
  - /stage1: progressive_3phase
  - /stage2: arcface_supcon
  - /stage3: sam_swa
  - /evaluation: audited_replica
  - /tracking: console
  - _self_

pipeline: three_stage

run_name: quadnet_audited_s${seed}
output_root: outputs
output_dir: ${output_root}/${run_name}

weight_decay: 2.0e-4
# 1.0, as executed. Against backbone pre-clip norms of 25-50, i.e. clipped on
# essentially every step. `grad_norm/clip_fraction` should read ≈1.0 here, and
# that contrast against seednet_full256's <0.2 is IC-6's evidence.
grad_clip: 1.0
ema_decay: 0.999
# 0.5, as executed. Expect `aux_weight/branch_{b,c}` pinned at the 4.0 ceiling
# and `branch_a` at the 0.25 floor within ~10 epochs.
aux_gradnorm_alpha: 0.5

tta_spatial: 8
tta_spectral: 4

device: auto
seed: 42

# The run's actual overrides, not the shipped defaults — see the banner above.
runtime:
  allow_tf32: true
  num_workers: 0
  compile: "off"
  amp_dtype: bf16

hydra:
  job:
    chdir: false
  run:
    dir: ${output_dir}/hydra/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${output_root}/multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
