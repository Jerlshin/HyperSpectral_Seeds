# Weights & Biases backend. Requires the `tracking` extra: pip install -e ".[tracking]"
defaults:
  - base_tracking
  - _self_

backend: wandb
project: spectralquadnet
entity: null
watch_model: false

# Selecting `wandb` alone leaves the terminal quiet: WandbTracker implements the
# machine channel only. To keep the pre-refactor console output alongside it:
#   python train.py tracking.backend=multi tracking.backends=[console,wandb]
