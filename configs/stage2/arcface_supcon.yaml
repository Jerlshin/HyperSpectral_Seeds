# Stage 2 — sub-centre ArcFace + SGDR + SupCon/ProtoNCE + class-difficulty weighting.
defaults:
  - base_stage2
  - _self_

epochs: 150
batch: 128
head_lr: 2.5e-4
back_lr: 7.0e-5
min_lr: 1.0e-6
warmup_ep: 3
sgdr_T0: 25
sgdr_Tmult: 2
dropout: 0.10
patience: 80

# ── Sub-centre ArcFace (arcface_s / arcface_m are also read at model build) ──
arcface_s: 48.0
arcface_m: 0.35
arcface_m0: 0.18
arcface_m_delta: 0.20 # HD-3's m_delta (was 0.10 under the F1-driven rule)
margin_warmup_ep: 20
focal_gamma: 1.5

# ── Signed precision/recall margin rule (HD-3 / T2-8) ─────────────────
# M(c) = clip(arcface_m + arcface_m_delta * (R_c - P_c), min, max).
# pairwise_margin_delta scales the row-normalised confusion matrix term that
# targets the margin at the confusion rather than at the class.
arcface_m_min: 0.20
arcface_m_max: 0.50
pairwise_margin_delta: 0.10

# ── Class-Difficulty-Weighted Sampling (also used by Stage 1/3 diagnostics) ──
cdws_max_weight: 3.0
cdws_eps: 0.05

# ── Contrastive auxiliaries (temperatures also reused by Stage 3) ─────
supcon_weight: 0.40
supcon_temp: 0.10
proto_weight: 0.18
proto_temp: 0.10

# ── Class-balanced batch composition: bal_n_cls × bal_n_spc ───────────
bal_n_cls: 16
bal_n_spc: 8
