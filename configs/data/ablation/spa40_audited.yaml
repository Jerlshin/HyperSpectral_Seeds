# ══════════════════════════════════════════════════════════════════════
#  FROZEN HISTORICAL REPLICA — NOT the primary path, and not an ablation arm
#  either. This file reproduces the *audited run's* input and partition exactly,
#  and every golden regression digest in `tests/regression/golden/v3/` was
#  captured against it. Its values are a record, not a configuration: changing
#  one silently invalidates the gates that make the audit auditable.
#
#  Composed only by `configs/experiment/quadnet_audited.yaml` and by
#  `scripts/capture_golden.py`. For a reduced-band *experiment*, use
#  `configs/data/ablation/spa40_grouped.yaml`; for the study's primary path, use
#  `configs/data/hsi256_grouped.yaml`.
# ══════════════════════════════════════════════════════════════════════
# 40-band SPA-selected VIS-NIR patches, 90 rice-seed varieties.
defaults:
  - base_data
  - _self_

# ── Paths (relative to the process CWD) ────────────────────────────────
patches_data: ./dataset/patches_spa_40b.npy
labels_path: ./dataset/labels.npy
wavelength_path: ./dataset/wavelengths_spa_40b.csv
groups_path: ./dataset/groups.npy

# ── Tier-3 side inputs (FE-2 / T3-7, FU-4 / P-4) ──────────────────────
# Deliberately empty here. This file reproduces the reference run, whose
# `patches_spa_40b.npy` predates T4-3's resize order, so no fill map exists that
# agrees with it and no morphometrics were persisted. Empty means the model uses
# its exact fallbacks — the `> 1e-5` band-sum threshold, and a zero morphometric
# vector — so this config keeps reproducing `outputs/output_v12_spa40/`.
masks_path: ""
morphology_path: ""

# ── Split protocol (P-1, P-5 / T4-1, T4-5) ────────────────────────────
# This file reproduces the *audited run's* protocol, which is the leaky one:
# `stratified` splits at patch level, so all 180 acquisition bundles appear in
# train, val and test alike — the executed run measured `180 of 180 scans are in
# train and in val/test`. (Docs previously said 107; that figure was wrong and
# is not divisible by 90 — see CHANGES §3.1 / IC-13.)
#
# The source dataset images each variety as TWO bundles of 48 kernels, each
# bundle a tray of one single variety. So every class's two — and only two —
# acquisition conditions are present in training, and a model that learns
# "this tray's residual radiometric signature => class X" scores correctly.
# The 0.847 macro-F1 is a mixture of variety recognition and acquisition-bundle
# recognition, and the mixing ratio has never been measured.
#
# Kept because the archived checkpoints were trained and selected on exactly
# this partition, and because A1 needs it as the leaky arm of the comparison.
# It is NOT a defensible reporting protocol.
#
# `configs/data/ablation/spa40_grouped.yaml` is the same arrays under the P-fix
# protocol (grouped + calib). Select it with `python train.py data=ablation/spa40_grouped`
# once `scripts/prepare_dataset.py` has been re-run to write groups.npy.
split_scheme: stratified
split_eval_frac: 0.30
split_fold: 0
calib_frac: 0.0
# Meaningless under `stratified` (there are no groups to be short of), but the
# key is required by the schema and a value of `error` states the intent.
single_group_policy: error
gain_path: ""

# ── Geometry ──────────────────────────────────────────────────────────
num_bands: 40
num_classes: 90

# ── Input perturbation used by RiceSeedDataset augmentation ───────────
max_cutout_bands: 3
noise_std: 0.02

# ── Same-class CutMix geometry (OP-6 / T2-7) ──────────────────────────
# A 8-of-40 band window is ~20% of the spectrum; a 24×24 paste is ~14% of the
# 64×64 patch area. Both are label-preserving because the partner is drawn from
# the same class, so no soft target and no change to the margin loss.
cutmix_bands: 8
cutmix_spatial: 24
