# SpectralQuadNet v4 — the AUDITED baseline. 4 branches + morphology token +
# bilinear fusion + 4 auxiliary heads, 5.19 M parameters, ≈4.06 GFLOP/sample.
#
# ══════════════════════════════════════════════════════════════════════
#  This file reproduces the architecture of run `stratified_benchmark_rtx3060`
#  exactly, and it is kept for one reason: it is the CONTROL ARM.
#
#  CHANGES §14 removes Branch A, Branch D, the bilinear fusion term, the
#  sub-centres and the asymmetric branch dropout. Ablations A3 (is the
#  four-branch design justified?) and A8 (do Stages 2-3 add anything?) are the
#  experiments that decide whether those removals were right. Deleting the
#  thing an ablation exists to falsify would make every removal unfalsifiable,
#  which is the exact defect this revision is correcting — so nothing here is
#  tuned, softened or "improved". Point `model=seed_net` at the replacement.
# ══════════════════════════════════════════════════════════════════════
defaults:
  - base_model
  - _self_

arch: spectral_quadnet

# ── Global architecture ───────────────────────────────────────────────
# The audited asymmetric profile, stated explicitly rather than inherited from
# a module default. At 0.20 the realised rates are (0.15, 0.15, 0.0, 0.15):
# Branch C is never dropped and the other three are absent 15% of the time.
#
# CHANGES §5.2 is why this is now written down instead of assumed. The policy
# taught the fusion gate to route onto the one branch that never vanishes, so
# Branch C's 87.4% end-state influence is CONFOUNDED and cannot be read as
# "C is intrinsically best". A3 re-runs this comparison with
# `branch_drop_profile: [1, 1, 1, 1]`, which is what makes it a measurement of
# the branches rather than of the dropout policy.
branch_drop_prob: 0.20
branch_drop_profile: [0.75, 0.75, 0.0, 0.75]
enabled_branches: [a, b, c, d]
fusion_mode: bilinear_gate

# Sub-centres. The log records `worst within-class sub-centre cosine 0.987` at
# Stage-2 entry: spherical k-means over real embeddings could not find three
# separated modes, so K=3 triples the head's parameters and adds a KL term
# whose job is to keep degenerate structure alive (~22 samples per sub-centre).
# Kept at 3 here because this is the audited arm; the replacement uses K=1.
subcenter_K: 3

# ── Sub-centre assignment (HD-2 / T2-9) ───────────────────────────────
# tau anneals 0.20 → 0.02 across a stage: every sub-centre receives gradient
# early (so none can die before it has seen data) and the assignment hardens
# back to the max_k it started as.
subcenter_tau_init: 0.20
subcenter_tau_final: 0.02
subcenter_balance_weight: 0.01

# ── Auxiliary classification heads (deep supervision, one per branch) ─
aux_head_hidden: 128

# ── Front end · FE-1 / T3-5 ───────────────────────────────────────────
# Fourier-feature width of the continuous-λ kernel generator κ_φ and of BR-4's
# relative-λ attention bias. The key was dead in the reference implementation
# (N-1c); §3.2 FE-1 nominates it as κ_φ's width rather than deleting it.
wl_embed_dim: 16

# ── Branch A (spectral profile) · BR-2 / T3-6 ─────────────────────────
# 8×8 is a 64:1 spatial compression against 4×4's 256:1 (§2.2.3). A processes
# cells independently, so this costs no parameters — only a larger flattened
# batch. Branch D keeps 4×4: A and D no longer share an input, and this is the
# other half of what closes C-2.
grid_size_a: 8
grid_size_d: 4

# ── Branch B (index bank) · BR-1 / T3-1 ───────────────────────────────
# 64 learned normalised-difference indices at 2 × 40 parameters each, plus the
# 16 deepest continuum-removed absorption depths, plus the 8 persisted
# morphometrics. 95 k parameters on a full-rank input, against 686 k on the
# rank-2 moment tensor of §2.2.5.
index_bank_size: 64
continuum_depths: 16
n_morphometrics: 8

# ── Branch C (spectral–spatial CNN) · BR-3 / T3-2 ─────────────────────
# Width the 3-D stem folds 64 features × 5 spectral positions into before the
# 2-D tail. The spectral axis is folded, not deleted.
stem_channels: 192

# ── Branch D (SpecFormer) · BR-4 / T3-3 ───────────────────────────────
# `specf_patch` now sets the λ-uniform token count (num_bands // (patch // 2) =
# 10), so token t means the same spectral region at any band count — which is
# what makes the branch transferable across the band-count ablation (F-3).
# `specf_dim` drops 256 → 192: with the wavelength axis carried explicitly by
# the token embeddings and the relative-λ bias, the branch needs less brute
# capacity. `specf_drop` was dead (N-1b) and is now the transformer dropout.
specf_patch: 8
specf_dim: 192
specf_heads: 8
specf_layers: 4
specf_drop: 0.15

# ── Cross-modal fusion · FU-1(b)/2/4/5 · T3-4 ─────────────────────────
# Rank of the bilinear projections U_m, and the gate MLP's hidden width. The
# gate reads the five normalised tokens *and* the five pre-normalisation
# log-norms (FU-2's confidence vector), and is a sigmoid rather than a softmax,
# so two modalities can be attended to at once (M-2b).
fusion_rank: 128
fusion_gate_hidden: 128
fusion_drop: 0.10

# ── Keys this architecture does not read ──────────────────────────────
# Present because the schema is shared with `seed_net`. `spatial_width_mult`
# does apply here (it scales Branch C's tail, which is A10's lever on either
# architecture); `spectral_hidden` and `aux_head_weight` belong to
# SpectralSeedNet's spectral path and single auxiliary head.
spatial_width_mult: 1.0
spectral_hidden: 256
aux_head_weight: 0.2

# ── Head elaborations — ON here, because this is the audited arm ──────
# Both were active in the run under audit and both are UNJUSTIFIED by it
# (CHANGES §5.4): the per-class margin vector took over at Stage-2 epoch 21 and
# the selected checkpoint was epoch 19, so it was never active at the model
# that was reported; the pairwise penalty was fitted on the same split that
# selected the checkpoint. A7 measures each in isolation.
per_class_margin: true
pairwise_penalty: true
