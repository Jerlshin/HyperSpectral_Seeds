# SpectralQuadNet v4 — 4 branches + Perceiver-style fusion + 4 auxiliary heads.
# Source: CONFIG["branch_drop_prob" … "fusion_drop"] (monolith lines 78-84, 132-139).
defaults:
  - base_model
  - _self_

# ── Global architecture ───────────────────────────────────────────────
branch_drop_prob: 0.20
subcenter_K: 3

# ── Auxiliary classification heads (deep supervision, one per branch) ─
aux_head_hidden: 128

# ── SpecFormer branch (D) ─────────────────────────────────────────────
wl_embed_dim: 16 # accepted by SpectralQuadNet.__init__ but unused (§1.3 tech debt)
specf_patch: 8
specf_dim: 256
specf_heads: 8
specf_layers: 4
specf_drop: 0.15

# ── Cross-modal fusion ────────────────────────────────────────────────
fusion_heads: 4
fusion_drop: 0.10
